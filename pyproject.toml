[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuiesp32"
version = "0.1.0"
description = "Terminal IDE for ESP32 MicroPython"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["textual[syntax]>=0.80", "pyserial>=3.5", "adafruit-ampy>=1.1.0", "platformdirs>=4"]

[project.scripts]
tuiesp32 = "tuiesp32:main"

[tool.setuptools]
py-modules = ["main", "tuiesp32"]
