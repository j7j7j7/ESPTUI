[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esptui"
version = "0.2.0"
description = "Terminal IDE for MicroPython on ESP32 and microcontrollers (ESPTUI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["textual[syntax]>=0.80", "pyserial>=3.5", "adafruit-ampy>=1.1.0", "platformdirs>=4", "esptool>=4.0"]

[project.scripts]
esptui = "esptui:main"
tuiesp32 = "esptui:main"

[tool.setuptools]
py-modules = ["main", "esptui", "tuiesp32", "i18n"]

[tool.setuptools.package-data]
"*" = ["config/lang/*.json"]
